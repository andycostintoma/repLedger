syntax = "proto3";

package training.v1;

import "training/v1/enums/equipment.proto";
import "training/v1/enums/exercise_family_code.proto";
import "training/v1/enums/feedback_workload.proto";
import "training/v1/enums/mesocycle_status.proto";
import "training/v1/enums/muscle_group.proto";
import "training/v1/enums/suggestion_status.proto";
import "training/v1/enums/training_method.proto";
import "training/v1/enums/workout_status.proto";

option go_package = "workout-tracker/backend/pb/training/v1;trainingv1";

service TrainingService {
  rpc GetTrainingCatalog(GetTrainingCatalogRequest) returns (GetTrainingCatalogResponse) {}
  rpc GetTodayWorkout(GetTodayWorkoutRequest) returns (GetTodayWorkoutResponse) {}
  rpc LogSet(LogSetRequest) returns (LogSetResponse) {}
  rpc SaveExerciseFeedback(SaveExerciseFeedbackRequest) returns (SaveExerciseFeedbackResponse) {}
  rpc SaveMuscleFeedback(SaveMuscleFeedbackRequest) returns (SaveMuscleFeedbackResponse) {}
  rpc SaveSuggestion(SaveSuggestionRequest) returns (SaveSuggestionResponse) {}
  rpc FinishWorkout(FinishWorkoutRequest) returns (FinishWorkoutResponse) {}
  rpc CreateMesocycle(CreateMesocycleRequest) returns (CreateMesocycleResponse) {}
  rpc CreateTemplateMesocycle(CreateTemplateMesocycleRequest) returns (CreateTemplateMesocycleResponse) {}
  rpc CreateExercise(CreateExerciseRequest) returns (CreateExerciseResponse) {}
  rpc UpdateExerciseName(UpdateExerciseNameRequest) returns (UpdateExerciseNameResponse) {}
  rpc UpdateExerciseCoefficients(UpdateExerciseCoefficientsRequest) returns (UpdateExerciseCoefficientsResponse) {}
}

message GetTrainingCatalogRequest {}

message GetTrainingCatalogResponse {
  repeated MuscleGroup muscle_groups = 1;
  repeated Exercise exercises = 2;
  repeated TemplateMesocycle template_mesocycles = 3;
  repeated Mesocycle mesocycles = 4;
  repeated ExerciseFamily exercise_families = 5;
}

message GetTodayWorkoutRequest {}
message GetTodayWorkoutResponse {
  string id = 1;
  string session_id = 2;
  string name = 3;
  optional string date = 4;
  WorkoutStatus status = 5;
  repeated PlannedExercise exercises = 6;
  repeated MuscleGroup muscles = 7;
  repeated MuscleVolumeFact volume_facts = 8;
  repeated MuscleFeedback muscle_feedback = 9;
  repeated NextSessionSuggestion suggestions = 10;
}

message Exercise {
  string id = 1;
  string name = 2;
  MuscleGroup primary_muscle = 3;
  repeated MuscleGroup primary_muscles = 4;
  repeated MuscleGroup secondary_muscles = 5;
  repeated ExerciseMuscleCoefficient muscle_coefficients = 6;
  optional ExerciseFamilyCode family_id = 7;
  Equipment equipment = 8;
  repeated ExerciseHistoryEntry history = 9;
}

message ExerciseMuscleCoefficient {
  MuscleGroup muscle = 1;
  double coefficient = 2;
}

message ExerciseFamily {
  string id = 1;
  string name = 2;
  string category = 3;
  repeated ExerciseMuscleCoefficient coefficients = 4;
  optional string notes = 5;
}

message TemplateMesocycle {
  string id = 1;
  string name = 2;
  string category = 3;
  string frequency = 4;
  string gender = 5;
  int32 weeks = 6;
  int32 days_per_week = 7;
}

message Mesocycle {
  string id = 1;
  string name = 2;
  MesocycleStatus status = 3;
  int32 weeks = 4;
  int32 days_per_week = 5;
  optional string started_at = 6;
  optional string completed_at = 7;
  int32 session_count = 8;
  optional string latest_session = 9;
  repeated MesocycleSession sessions = 10;
}

message PlannedExercise {
  string id = 1;
  string exercise_id = 2;
  string name = 3;
  Equipment equipment = 4;
  TrainingMethod method = 5;
  int32 programmed_sets = 6;
  string target_rep_range = 7;
  string previous_performance = 8;
  MuscleGroup primary_muscle = 9;
  repeated LoggedSet logged_sets = 10;
  optional ExerciseFeedback feedback = 11;
}

message LoggedSet {
  int32 set_index = 1;
  string load_text = 2;
  int32 reps = 3;
  optional string notes = 4;
  optional int32 pain = 5;
}

message ExerciseFeedback {
  optional int32 pain_after = 1;
  optional string notes = 2;
}

message MuscleFeedback {
  MuscleGroup muscle = 1;
  optional int32 soreness = 2;
  optional int32 pump = 3;
  optional FeedbackWorkload workload = 4;
  optional string notes = 5;
}

message MuscleVolumeFact {
  MuscleGroup muscle = 1;
  double session_direct_sets = 2;
  double session_indirect_sets = 3;
  double session_effective_sets = 4;
  double week_to_date_direct_sets = 5;
  double week_to_date_indirect_sets = 6;
  double week_to_date_effective_sets = 7;
}

message NextSessionSuggestion {
  MuscleGroup muscle = 1;
  string suggestion = 2;
  SuggestionStatus status = 3;
}

message MesocycleSession {
  string id = 1;
  string name = 2;
  optional string training_date = 3;
  WorkoutStatus status = 4;
  optional int32 week_number = 5;
  optional int32 day_number = 6;
  optional string source = 7;
  optional string notes = 8;
  int32 total_sets = 9;
  repeated MesocycleExercise exercises = 10;
}

message MesocycleExercise {
  string id = 1;
  string name = 2;
  Equipment equipment = 3;
  MuscleGroup primary_muscle = 4;
  TrainingMethod method = 5;
  string target_rep_range = 6;
  repeated LoggedSet sets = 7;
}

message ExerciseHistoryEntry {
  string session_id = 1;
  string label = 2;
  string workout_name = 3;
  string load_text = 4;
  int32 reps = 5;
  int32 set_index = 6;
}

message LogSetRequest {
  string session_id = 1;
  string template_exercise_id = 2;
  int32 set_index = 3;
  string load_text = 4;
  int32 reps = 5;
  optional string notes = 6;
  optional int32 pain = 7;
}
message LogSetResponse {}

message SaveExerciseFeedbackRequest {
  string session_id = 1;
  string template_exercise_id = 2;
  optional int32 pain_after = 3;
  optional string notes = 4;
}
message SaveExerciseFeedbackResponse {}

message SaveMuscleFeedbackRequest {
  string session_id = 1;
  MuscleGroup muscle = 2;
  optional int32 soreness = 3;
  optional int32 pump = 4;
  optional FeedbackWorkload workload = 5;
  optional string notes = 6;
}
message SaveMuscleFeedbackResponse {}

message SaveSuggestionRequest {
  string session_id = 1;
  MuscleGroup muscle = 2;
  string suggestion = 3;
  SuggestionStatus status = 4;
}
message SaveSuggestionResponse {}

message FinishWorkoutRequest {
  string session_id = 1;
}
message FinishWorkoutResponse {}

message CreateMesocycleRequest {
  string name = 1;
  int32 weeks = 2;
  int32 days_per_week = 3;
  MesocycleStatus status = 4;
  optional string template_meso_id = 5;
}
message CreateMesocycleResponse {
  string id = 1;
}

message CreateTemplateMesocycleRequest {
  string name = 1;
  string category = 2;
  string frequency = 3;
  string gender = 4;
  int32 weeks = 5;
  int32 days_per_week = 6;
}
message CreateTemplateMesocycleResponse {
  string id = 1;
}

message CreateExerciseRequest {
  string name = 1;
  MuscleGroup primary_muscle = 2;
  Equipment equipment = 3;
  optional ExerciseFamilyCode family_id = 4;
  repeated ExerciseMuscleCoefficient coefficients = 5;
}
message CreateExerciseResponse {
  string id = 1;
}

message UpdateExerciseNameRequest {
  string exercise_id = 1;
  string name = 2;
}
message UpdateExerciseNameResponse {}

message UpdateExerciseCoefficientsRequest {
  string exercise_id = 1;
  repeated ExerciseMuscleCoefficient coefficients = 2;
  optional ExerciseFamilyCode family_id = 3;
}
message UpdateExerciseCoefficientsResponse {}
