syntax = "proto3";

package training.v1;

import "common/v1/options/enum_friendly_string.proto";
import "common/v1/options/enum_string_val.proto";

option go_package = "workout-tracker/backend/pb/training/v1;trainingv1";

enum SuggestionStatus {
  SUGGESTION_STATUS_UNKNOWN = 0
  [(common.v1.options.string_val) = "",
  (common.v1.options.friendly_string) = "Unknown"];
  SUGGESTION_STATUS_PROPOSED = 1
  [(common.v1.options.string_val) = "proposed",
  (common.v1.options.friendly_string) = "Proposed"];
  SUGGESTION_STATUS_ACCEPTED = 2
  [(common.v1.options.string_val) = "accepted",
  (common.v1.options.friendly_string) = "Accepted"];
  SUGGESTION_STATUS_IGNORED = 3
  [(common.v1.options.string_val) = "ignored",
  (common.v1.options.friendly_string) = "Ignored"];
  SUGGESTION_STATUS_EDITED = 4
  [(common.v1.options.string_val) = "edited",
  (common.v1.options.friendly_string) = "Edited"];
}
