syntax = "proto3";

package training.v1;

import "common/v1/options/enum_friendly_string.proto";
import "common/v1/options/enum_string_val.proto";

option go_package = "workout-tracker/backend/pb/training/v1;trainingv1";

enum TrainingMethod {
  TRAINING_METHOD_UNKNOWN = 0
  [(common.v1.options.string_val) = "",
  (common.v1.options.friendly_string) = "Unknown"];
  TRAINING_METHOD_REGULAR = 1
  [(common.v1.options.string_val) = "regular",
  (common.v1.options.friendly_string) = "Regular"];
  TRAINING_METHOD_MYO_MATCH = 2
  [(common.v1.options.string_val) = "myo-match",
  (common.v1.options.friendly_string) = "Myo-match"];
}
